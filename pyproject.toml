[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcgen"
version = "0.1.0"
description = "Local-first, multi-agent PRD-to-test-case generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-ollama>=0.2",
    "ollama>=0.4",
    "langchain-chroma>=0.1",
    "langchain-text-splitters>=0.3",
    "pydantic>=2",
    "PyYAML>=6",
    "typer>=0.12",
    "pypdf>=5",
    "python-docx>=1.1",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.40",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.scripts]
tcgen = "tcgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tcgen = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=tcgen --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["tcgen"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
ignore_missing_imports = true
warn_unreachable = true
